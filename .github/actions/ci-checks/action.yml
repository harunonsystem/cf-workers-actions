---
name: "CI Checks"
description: "Run common CI checks: install dependencies, build, type check, lint, and test"

inputs:
  node-version:
    description: "Node.js version to use"
    required: true
  run-quality:
    description: "Run build, type checking, and linting in addition to tests"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build TypeScript
      if: inputs.run-quality == 'true'
      run: pnpm run build
      shell: bash

    - name: Run type checking
      if: inputs.run-quality == 'true'
      run: pnpm run typecheck
      shell: bash

    - name: Check formatting (oxfmt)
      if: inputs.run-quality == 'true'
      run: pnpm run format:check
      shell: bash

    - name: Run linter (oxlint)
      if: inputs.run-quality == 'true'
      run: pnpm run lint
      shell: bash

    - name: Run tests (Vitest)
      run: pnpm test
      shell: bash
